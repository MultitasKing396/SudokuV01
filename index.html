<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sudoku NFC Mini Game</title>
<style>
  html, body {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: manipulation;
    overscroll-behavior: none;
    margin: 0;
    padding: 0;
  }
  body {
    background: #111;
    color: #fff;
    font-family: sans-serif;
    text-align: center;
    user-select: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .head { font-size: 13px; letter-spacing: 1px; margin-bottom: 6px; color: #ccc; }
  .head b { color: #00e5ff; font-size: 15px; }
  .bar { width: 292px; margin: 0 auto 8px; display: flex; justify-content: space-between; align-items: center; }
  .reset { height: 32px; padding: 0 12px; font-size: 12px; background: #333; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  .pause { width: 42px; height: 32px; font-size: 15px; background: #2a2a2a; color: #fff; border: 1px solid #555; border-radius: 6px; cursor: pointer; }
  .pause:active { background: #444; }
  .board-wrap { position: relative; width: 292px; height: 292px; margin: 0 auto 10px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);
    width: 292px;
    height: 292px;
    background: #000;
    border: 2px solid #666;
    box-sizing: border-box;
  }
  .cell {
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 17px;
    border-right: 1px solid #2a2a2a;
    border-bottom: 1px solid #2a2a2a;
    cursor: pointer;
    box-sizing: border-box;
  }
  .cell:nth-child(3n) { border-right: 2px solid #666; }
  .cell:nth-child(9n) { border-right: 0; }
  .cell.b-thick { border-bottom: 2px solid #666; }
  .cell.given { color: #ffffff; font-weight: bold; }
  .cell.user { color: #00e5ff; font-weight: bold; }
  .cell.err { color: #ff3b30; background: rgba(255, 59, 48, 0.16); }
  .cell.same { background: rgba(0, 229, 255, 0.12); }
  .cell.sel { background: rgba(0, 229, 255, 0.32); }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.94);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border: 2px solid #666;
    box-sizing: border-box;
    padding: 16px;
    z-index: 30;
  }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0 0 12px; font-size: 20px; color: #00e5ff; letter-spacing: 1px; }
  .overlay p { margin: 4px 0; font-size: 14px; color: #fff; }
  .overlay .sub { margin-top: 16px; font-size: 11px; color: #777; }
  .diff-btns { display: flex; flex-direction: column; gap: 10px; width: 170px; margin-top: 6px; }
  .diff-btns button {
    padding: 12px 0;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1px;
    background: #222;
    color: #fff;
    border: 1px solid #555;
    border-radius: 8px;
    cursor: pointer;
  }
  .diff-btns button:active { background: #444; }
  .diff-btns button.easy { border-color: #00ff00; color: #00ff00; }
  .diff-btns button.med { border-color: #00e5ff; color: #00e5ff; }
  .diff-btns button.hard { border-color: #ff7700; color: #ff7700; }
  .numpad {
    display: grid;
    grid-template-columns: repeat(5, 52px);
    gap: 6px;
    justify-content: center;
  }
  .numpad button {
    height: 44px;
    font-size: 18px;
    font-weight: bold;
    background: #222;
    color: #fff;
    border: 1px solid #444;
    border-radius: 8px;
    cursor: pointer;
  }
  .numpad button:active { background: #444; }
  .numpad button.del { color: #ff3b30; font-size: 16px; }
  .info { font-size: 11px; color: #888; margin-top: 10px; }
</style>
</head>
<body>
  <div class="head">SUDOKU NFC MINI GAME<br><span id="lvlLabel">LÄDT...</span> · ZEIT <b id="tm">00:00</b></div>
  <div class="bar">
    <button type="button" id="btnReset" class="reset">Neu starten</button>
    <button type="button" id="pb" class="pause">▶</button>
  </div>
  <div class="board-wrap">
    <div id="grid" class="grid"></div>
    <div id="menuOv" class="overlay show">
      <h2>SCHWIERIGKEIT</h2>
      <div class="diff-btns">
        <button type="button" id="btnEasy" class="easy">EINFACH</button>
        <button type="button" id="btnMed" class="med">MITTEL</button>
        <button type="button" id="btnHard" class="hard">SCHWER</button>
      </div>
    </div>
    <div id="ov" class="overlay">
      <h2 id="ovTitle">GELÖST!</h2>
      <p id="ovTime"></p>
      <p id="ovBest"></p>
      <div class="sub" id="ovSub">Tippen für neues Rätsel</div>
    </div>
  </div>
  <div class="numpad" id="numpad">
    <button type="button" data-n="1">1</button>
    <button type="button" data-n="2">2</button>
    <button type="button" data-n="3">3</button>
    <button type="button" data-n="4">4</button>
    <button type="button" data-n="5">5</button>
    <button type="button" data-n="6">6</button>
    <button type="button" data-n="7">7</button>
    <button type="button" data-n="8">8</button>
    <button type="button" data-n="9">9</button>
    <button type="button" class="del" data-n="0">⌫</button>
  </div>
  <div class="info">by Alp</div>

<script>
(function() {
  var gridEl = document.getElementById("grid");
  var tmEl = document.getElementById("tm");
  var pbEl = document.getElementById("pb");
  var lvlEl = document.getElementById("lvlLabel");
  var menuOv = document.getElementById("menuOv");
  var ovEl = document.getElementById("ov");
  var ovTitle = document.getElementById("ovTitle");
  var ovTime = document.getElementById("ovTime");
  var ovBest = document.getElementById("ovBest");
  var ovSub = document.getElementById("ovSub");

  var currentDiff = "med";
  var solution = new Array();
  var puzzle = new Array();
  var current = new Array();
  var selected = -1;
  var sec = 0;
  var timer = null;
  var paused = false;
  var won = false;
  var inMenu = true;

  function makeEmptyBoard() {
    var b = new Array();
    for (var i = 0; i < 81; i++) {
      b.push(0);
    }
    return b;
  }

  function getItem(arr, i) {
    return arr.slice(i, i + 1).pop();
  }

  function getDiffInfo(diff) {
    if (diff === "easy") return { name: "EINFACH", holes: 32, color: "#00ff00" };
    if (diff === "hard") return { name: "SCHWER",  holes: 54, color: "#ff7700" };
    return { name: "MITTEL", holes: 44, color: "#00e5ff" };
  }

  function getBest() {
    return Number(localStorage.getItem("sudoku_nfc_best_" + currentDiff)) || 0;
  }

  function setBest(val) {
    localStorage.setItem("sudoku_nfc_best_" + currentDiff, val);
  }

  function formatTime(s) {
    var m = String(Math.floor(s / 60));
    var r = String(s % 60);
    if (m.length < 2) m = "0" + m;
    if (r.length < 2) r = "0" + r;
    return m + ":" + r;
  }

  function shuffle(arr) {
    var copy = arr.slice();
    var res = new Array();
    while (copy.length > 0) {
      var idx = Math.floor(Math.random() * copy.length);
      res.push(copy.splice(idx, 1).pop());
    }
    return res;
  }

  function isValid(board, idx, num) {
    var r = Math.floor(idx / 9);
    var c = idx % 9;
    var br = Math.floor(r / 3) * 3;
    var bc = Math.floor(c / 3) * 3;
    for (var i = 0; i < 9; i++) {
      if (getItem(board, r * 9 + i) === num) return false;
      if (getItem(board, i * 9 + c) === num) return false;
      var rr = br + Math.floor(i / 3);
      var cc = bc + (i % 3);
      if (getItem(board, rr * 9 + cc) === num) return false;
    }
    return true;
  }

  function solveBoard(board) {
    var empty = board.indexOf(0);
    if (empty === -1) return true;
    var baseNums = new Array(1, 2, 3, 4, 5, 6, 7, 8, 9);
    var nums = shuffle(baseNums);
    for (var j = 0; j < nums.length; j++) {
      var n = getItem(nums, j);
      if (isValid(board, empty, n)) {
        board.splice(empty, 1, n);
        if (solveBoard(board)) return true;
        board.splice(empty, 1, 0);
      }
    }
    return false;
  }

  function generateSudoku(holes) {
    var full = makeEmptyBoard();
    solveBoard(full);
    solution = full.slice();
    var puz = full.slice();
    var allIdx = new Array();
    for (var k = 0; k < 81; k++) {
      allIdx.push(k);
    }
    var indices = shuffle(allIdx);
    for (var m = 0; m < holes; m++) {
      var idx = getItem(indices, m);
      puz.splice(idx, 1, 0);
    }
    puzzle = puz;
    current = puz.slice();
  }

  function render() {
    gridEl.innerHTML = "";
    var selVal = selected >= 0 ? getItem(current, selected) : 0;
    for (var i = 0; i < 81; i++) {
      var cell = document.createElement("div");
      cell.className = "cell";
      var r = Math.floor(i / 9);
      if (r === 2 || r === 5) cell.classList.add("b-thick");
      var val = getItem(current, i);
      if (val !== 0) {
        cell.textContent = val;
        if (getItem(puzzle, i) !== 0) {
          cell.classList.add("given");
        } else {
          cell.classList.add("user");
          if (val !== getItem(solution, i)) cell.classList.add("err");
        }
        if (selVal !== 0 && val === selVal && i !== selected) {
          cell.classList.add("same");
        }
      }
      if (i === selected) cell.classList.add("sel");
      (function(index) {
        cell.addEventListener("click", function() {
          if (inMenu || paused || won) return;
          selected = index;
          render();
        });
      })(i);
      gridEl.appendChild(cell);
    }
  }

  function checkWin() {
    for (var i = 0; i < 81; i++) {
      if (getItem(current, i) !== getItem(solution, i)) return;
    }
    won = true;
    clearInterval(timer);
    pbEl.textContent = "▶";
    var best = getBest();
    if (best === 0 || sec < best) {
      best = sec;
      setBest(best);
    }
    var info = getDiffInfo(currentDiff);
    ovTitle.textContent = "GELÖST!";
    ovTitle.style.color = info.color;
