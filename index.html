<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sudoku NFC Mini Game</title>
<style>
  html, body {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    margin: 0;
    padding: 0;
  }
  body {
    background: #111;
    color: #fff;
    font-family: sans-serif;
    text-align: center;
    user-select: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .head { font-size: 13px; letter-spacing: 1px; margin-bottom: 6px; color: #ccc; }
  .head b { color: #00e5ff; font-size: 15px; }
  .bar { width: 292px; margin: 0 auto 8px; display: flex; justify-content: space-between; align-items: center; }
  .reset { height: 32px; padding: 0 12px; font-size: 12px; background: #333; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  .pause { width: 42px; height: 32px; font-size: 15px; background: #2a2a2a; color: #fff; border: 1px solid #555; border-radius: 6px; cursor: pointer; }
  .wrap { position: relative; width: 292px; height: 292px; margin: 0 auto 10px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);
    width: 292px;
    height: 292px;
    background: #000;
    border: 2px solid #666;
    box-sizing: border-box;
  }
  .cell {
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 17px;
    border-right: 1px solid #2a2a2a;
    border-bottom: 1px solid #2a2a2a;
    box-sizing: border-box;
    cursor: pointer;
  }
  .cell:nth-child(3n) { border-right: 2px solid #666; }
  .cell:nth-child(9n) { border-right: 0; }
  .cell.bt { border-bottom: 2px solid #666; }
  .given { color: #fff; font-weight: bold; }
  .user { color: #00e5ff; font-weight: bold; }
  .err { color: #ff3b30; background: rgba(255, 59, 48, 0.2); }
  .same { background: rgba(0, 229, 255, 0.12); }
  .sel { background: rgba(0, 229, 255, 0.35); }
  .ov {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.92);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border: 2px solid #666;
    box-sizing: border-box;
    z-index: 50;
  }
  .ov.show { display: flex; }
  .ov h2 { margin: 0 0 10px; font-size: 22px; color: #0f0; letter-spacing: 1px; }
  .ov p { margin: 4px 0; font-size: 14px; color: #fff; }
  .ov .sub { margin-top: 14px; font-size: 11px; color: #777; }
  .pad { display: grid; grid-template-columns: repeat(5, 52px); gap: 6px; justify-content: center; }
  .pad button {
    height: 44px;
    font-size: 18px;
    font-weight: bold;
    background: #222;
    color: #fff;
    border: 1px solid #444;
    border-radius: 8px;
    cursor: pointer;
  }
  .pad button:active { background: #444; }
  .info { font-size: 11px; color: #888; margin-top: 10px; }
</style>
</head>
<body>
  <div class="head">SUDOKU NFC MINI GAME<br>ZEIT <b id="tm">00:00</b></div>
  <div class="bar">
    <button class="reset" onclick="init()">Neu starten</button>
    <button id="pb" class="pause" onclick="tp()">❚❚</button>
  </div>
  <div class="wrap">
    <div id="grid" class="grid"></div>
    <div id="ov" class="ov" onclick="ovTap()">
      <h2 id="ovT">GELÖST!</h2>
      <p id="ov1"></p>
      <p id="ov2"></p>
      <div class="sub" id="ovS"></div>
    </div>
  </div>
  <div class="pad">
    <button onclick="num(1)">1</button>
    <button onclick="num(2)">2</button>
    <button onclick="num(3)">3</button>
    <button onclick="num(4)">4</button>
    <button onclick="num(5)">5</button>
    <button onclick="num(6)">6</button>
    <button onclick="num(7)">7</button>
    <button onclick="num(8)">8</button>
    <button onclick="num(9)">9</button>
    <button style="color:#ff3b30" onclick="num(0)">⌫</button>
  </div>
  <div class="info">by Alp</div>

<script>
const g = document.getElementById("grid");
const tm = document.getElementById("tm");
const pb = document.getElementById("pb");
const ov = document.getElementById("ov");
const ovT = document.getElementById("ovT");
const ov1 = document.getElementById("ov1");
const ov2 = document.getElementById("ov2");
const ovS = document.getElementById("ovS");

let sol = "", puz = "", cur = "", sel = -1, sec = 0, tmr = null, paused = false, over = false;
let best = Number(localStorage.getItem("sudoku_nfc_best")) || 0;

function fmt(s) {
  const m = Math.floor(s / 60);
  const r = s % 60;
  return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r;
}

function build() {
  const base = "123456789456789123789123456234567891567891234891234567345678912678912345912345678";
  let d = "123456789";
  for (let i = 0; i < 30; i++) {
    const a = Math.floor(Math.random() * 9);
    const b = Math.floor(Math.random() * 9);
    if (a !== b) {
      const l = Math.min(a, b), h = Math.max(a, b);
      d = d.slice(0, l) + d.charAt(h) + d.slice(l + 1, h) + d.charAt(l) + d.slice(h + 1);
    }
  }
  sol = "";
  for (let k = 0; k < 81; k++) {
    sol += d.charAt(Number(base.charAt(k)) - 1);
  }
  let mask = "000000000000000000000000000000000000000011111111111111111111111111111111111111111";
  for (let m = 0; m < 250; m++) {
    const p1 = Math.floor(Math.random() * 81);
    const p2 = Math.floor(Math.random() * 81);
    if (p1 !== p2) {
      const l = Math.min(p1, p2), h = Math.max(p1, p2);
      mask = mask.slice(0, l) + mask.charAt(h) + mask.slice(l + 1, h) + mask.charAt(l) + mask.slice(h + 1);
    }
  }
  puz = "";
  for (let q = 0; q < 81; q++) {
    puz += mask.charAt(q) === "0" ? "0" : sol.charAt(q);
  }
  cur = puz;
}

function draw() {
  g.innerHTML = "";
  const sv = sel >= 0 ? cur.charAt(sel) : "0";
  for (let i = 0; i < 81; i++) {
    const c = document.createElement("div");
    const r = Math.floor(i / 9);
    c.className = "cell" + (r === 2 || r === 5 ? " bt" : "");
    const v = cur.charAt(i);
    if (v !== "0") {
      c.textContent = v;
      if (puz.charAt(i) !== "0") {
        c.classList.add("given");
      } else {
        c.classList.add("user");
        if (v !== sol.charAt(i)) c.classList.add("err");
      }
      if (sv !== "0" && v === sv && i !== sel) c.classList.add("same");
    }
    if (i === sel) c.classList.add("sel");
    c.onclick = () => {
      if (paused || over) return;
      sel = i;
      draw();
    };
    g.appendChild(c);
  }
}

function num(n) {
  if (paused || over || sel < 0 || puz.charAt(sel) !== "0") return;
  cur = cur.slice(0, sel) + String(n) + cur.slice(sel + 1);
  draw();
  if (n !== 0 && cur === sol) {
    over = true;
    clearInterval(tmr);
    pb.textContent = "▶";
    if (best === 0 || sec < best) {
      best = sec;
      localStorage.setItem("sudoku_nfc_best", best);
    }
    ovT.textContent = "GELÖST!";
    ovT.style.color = "#0f0";
    ov1.textContent = "Deine Zeit: " + fmt(sec);
    ov2.textContent = "Bestzeit: " + fmt(best);
    ovS.textContent = "Tippen für neues Rätsel";
    ov.classList.add("show");
  }
}

function tp() {
  if (over) { init(); return; }
  paused = !paused;
  if (paused) {
    clearInterval(tmr);
    pb.textContent = "▶";
    ovT.textContent = "PAUSIERT";
    ovT.style.color = "#00e5ff";
    ov1.textContent = "Aktuelle Zeit: " + fmt(sec);
    ov2.textContent = best > 0 ? "Bestzeit: " + fmt(best) : "";
    ovS.textContent = "Tippen zum Fortsetzen";
    ov.classList.add("show");
  } else {
    pb.textContent = "❚❚";
    ov.classList.remove("show");
    run();
  }
}

function ovTap() {
  if (over) init();
  else if (paused) tp();
}

function run() {
  clearInterval(tmr);
  tmr = setInterval(() => {
    sec++;
    tm.textContent = fmt(sec);
  }, 1000);
}

function init() {
  build();
  sel = -1;
  sec = 0;
  paused = false;
  over = false;
  tm.textContent = "00:00";
  pb.textContent = "❚❚";
  ov.classList.remove("show");
  draw();
  run();
}

document.addEventListener("touchmove", e => e.preventDefault(), {passive: false});
init();
</script>
</body>
</html>
