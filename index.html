<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sudoku NFC Mini Game</title>
<style>
  html, body {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: manipulation;
    overscroll-behavior: none;
    margin: 0;
    padding: 0;
  }
  body {
    background: #111;
    color: #fff;
    font-family: sans-serif;
    text-align: center;
    user-select: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .head { font-size: 13px; letter-spacing: 1px; margin-bottom: 6px; color: #ccc; }
  .head b { color: #00e5ff; font-size: 15px; }
  .bar { width: 292px; margin: 0 auto 8px; display: flex; justify-content: space-between; align-items: center; }
  .reset { height: 32px; padding: 0 12px; font-size: 12px; background: #333; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  .pause { width: 42px; height: 32px; font-size: 15px; background: #2a2a2a; color: #fff; border: 1px solid #555; border-radius: 6px; cursor: pointer; }
  .wrap { position: relative; width: 292px; height: 292px; margin: 0 auto 10px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);
    width: 292px;
    height: 292px;
    background: #000;
    border: 2px solid #666;
    box-sizing: border-box;
  }
  .cell {
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 17px;
    border-right: 1px solid #2a2a2a;
    border-bottom: 1px solid #2a2a2a;
    box-sizing: border-box;
    cursor: pointer;
  }
  .cell:nth-child(3n) { border-right: 2px solid #666; }
  .cell:nth-child(9n) { border-right: 0; }
  .cell.bt { border-bottom: 2px solid #666; }
  .given { color: #fff; font-weight: bold; }
  .user { color: #00e5ff; font-weight: bold; }
  .err { color: #ff3b30; background: rgba(255, 59, 48, 0.2); }
  .same { background: rgba(0, 229, 255, 0.12); }
  .sel { background: rgba(0, 229, 255, 0.35); }
  .ov {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.95);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border: 2px solid #666;
    box-sizing: border-box;
    z-index: 100;
  }
  .ov.show { display: flex; }
  .ov h2 { margin: 0 0 14px; font-size: 19px; color: #00e5ff; letter-spacing: 1px; }
  .ov p { margin: 4px 0; font-size: 14px; color: #fff; }
  .ov .sub { margin-top: 16px; font-size: 11px; color: #777; }
  .btns { display: flex; flex-direction: column; gap: 10px; width: 170px; }
  .btns button {
    padding: 12px 0;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1px;
    background: #222;
    border: 1px solid #555;
    border-radius: 8px;
    cursor: pointer;
  }
  .btns button:active { background: #444; }
  .pad { display: grid; grid-template-columns: repeat(5, 52px); gap: 6px; justify-content: center; }
  .pad button {
    height: 44px;
    font-size: 18px;
    font-weight: bold;
    background: #222;
    color: #fff;
    border: 1px solid #444;
    border-radius: 8px;
    cursor: pointer;
  }
  .pad button:active { background: #444; }
  .info { font-size: 11px; color: #888; margin-top: 10px; }
</style>
</head>
<body>
  <div class="head">SUDOKU NFC MINI GAME<br>ZEIT <b id="tm">00:00</b></div>
  <div class="bar">
    <button type="button" class="reset" onclick="openMenu()">Neu starten</button>
    <button type="button" id="pb" class="pause" onclick="togglePause()">▶</button>
  </div>
  <div class="wrap">
    <div id="grid" class="grid"></div>
    <div id="menuBox" class="ov show">
      <h2>SCHWIERIGKEIT</h2>
      <div class="btns">
        <button type="button" style="border-color:#0f0;color:#0f0" onclick="startLevel(32,'EINFACH')">EINFACH</button>
        <button type="button" style="border-color:#00e5ff;color:#00e5ff" onclick="startLevel(44,'MITTEL')">MITTEL</button>
        <button type="button" style="border-color:#ff7700;color:#ff7700" onclick="startLevel(54,'SCHWER')">SCHWER</button>
      </div>
    </div>
    <div id="msgBox" class="ov" onclick="closeMsg()">
      <h2 id="mTitle">GELÖST!</h2>
      <p id="mLine1"></p>
      <p id="mLine2"></p>
      <div class="sub" id="mSub"></div>
    </div>
  </div>
  <div class="pad">
    <button type="button" onclick="putNum(1)">1</button>
    <button type="button" onclick="putNum(2)">2</button>
    <button type="button" onclick="putNum(3)">3</button>
    <button type="button" onclick="putNum(4)">4</button>
    <button type="button" onclick="putNum(5)">5</button>
    <button type="button" onclick="putNum(6)">6</button>
    <button type="button" onclick="putNum(7)">7</button>
    <button type="button" onclick="putNum(8)">8</button>
    <button type="button" onclick="putNum(9)">9</button>
    <button type="button" style="color:#ff3b30" onclick="putNum(0)">⌫</button>
  </div>
  <div class="info">by Alp</div>

<script>
var sol = "";
var puz = "";
var cur = "";
var sel = -1;
var sec = 0;
var tmr = null;
var paused = false;
var finished = false;
var inMenu = true;
var levelName = "MITTEL";

function formatTime(s) {
  var m = Math.floor(s / 60);
  var r = s % 60;
  return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r;
}

function createPuzzle(holes) {
  var base = "123456789456789123789123456234567891567891234891234567345678912678912345912345678";
  var digits = "123456789";
  for (var i = 0; i < 30; i++) {
    var a = Math.floor(Math.random() * 9);
    var b = Math.floor(Math.random() * 9);
    if (a !== b) {
      var lo = Math.min(a, b);
      var hi = Math.max(a, b);
      digits = digits.slice(0, lo) + digits.charAt(hi) + digits.slice(lo + 1, hi) + digits.charAt(lo) + digits.slice(hi + 1);
    }
  }
  sol = "";
  for (var k = 0; k < 81; k++) {
    sol += digits.charAt(Number(base.charAt(k)) - 1);
  }
  var mask = "";
  for (var z = 0; z < 81; z++) {
    mask += z < holes ? "0" : "1";
  }
  for (var m = 0; m < 250; m++) {
    var p1 = Math.floor(Math.random() * 81);
    var p2 = Math.floor(Math.random() * 81);
    if (p1 !== p2) {
      var l = Math.min(p1, p2);
      var h = Math.max(p1, p2);
      mask = mask.slice(0, l) + mask.charAt(h) + mask.slice(l + 1, h) + mask.charAt(l) + mask.slice(h + 1);
    }
  }
  puz = "";
  for (var q = 0; q < 81; q++) {
    puz += mask.charAt(q) === "0" ? "0" : sol.charAt(q);
  }
  cur = puz;
}

function renderGrid() {
  var g = document.getElementById("grid");
  g.innerHTML = "";
  var activeVal = sel >= 0 ? cur.charAt(sel) : "0";
  for (var i = 0; i < 81; i++) {
    var cell = document.createElement("div");
    var row = Math.floor(i / 9);
    cell.className = "cell" + (row === 2 || row === 5 ? " bt" : "");
    var val = cur.charAt(i);
    if (val !== "0") {
      cell.textContent = val;
      if (puz.charAt(i) !== "0") {
        cell.classList.add("given");
      } else {
        cell.classList.add("user");
        if (val !== sol.charAt(i)) {
          cell.classList.add("err");
        }
      }
      if (activeVal !== "0" && val === activeVal && i !== sel) {
        cell.classList.add("same");
      }
    }
    if (i === sel) {
      cell.classList.add("sel");
    }
    cell.setAttribute("onclick", "selectCell(" + i + ")");
    g.appendChild(cell);
  }
}

function selectCell(i) {
  if (inMenu || paused || finished) return;
  sel = i;
  renderGrid();
}

function putNum(n) {
  if (inMenu || paused || finished || sel < 0 || puz.charAt(sel) !== "0") return;
  cur = cur.slice(0, sel) + String(n) + cur.slice(sel + 1);
  renderGrid();
  if (n !== 0 && cur === sol) {
    finished = true;
    clearInterval(tmr);
    document.getElementById("pb").textContent = "▶";
    var storeKey = "sudoku_best_" + levelName;
    var best = Number(localStorage.getItem(storeKey)) || 0;
    if (best === 0 || sec < best) {
      best = sec;
      localStorage.setItem(storeKey, best);
    }
    document.getElementById("mTitle").textContent = "GELÖST!";
    document.getElementById("mTitle").style.color = "#0f0";
    document.getElementById("mLine1").textContent = "Zeit (" + levelName + "): " + formatTime(sec);
    document.getElementById("mLine2").textContent = "Bestzeit: " + formatTime(best);
    document.getElementById("mSub").textContent = "Tippen für Stufenauswahl";
    document.getElementById("msgBox").classList.add("show");
  }
}

function togglePause() {
  if (inMenu) return;
  if (finished) {
    openMenu();
    return;
  }
  paused = !paused;
  if (paused) {
    clearInterval(tmr);
    document.getElementById("pb").textContent = "▶";
    var best = Number(localStorage.getItem("sudoku_best_" + levelName)) || 0;
    document.getElementById("mTitle").textContent = "PAUSIERT";
    document.getElementById("mTitle").style.color = "#00e5ff";
    document.getElementById("mLine1").textContent = "Zeit (" + levelName + "): " + formatTime(sec);
    document.getElementById("mLine2").textContent = best > 0 ? "Bestzeit: " + formatTime(best) : "";
    document.getElementById("mSub").textContent = "Tippen zum Fortsetzen";
    document.getElementById("msgBox").classList.add("show");
  } else {
    document.getElementById("pb").textContent = "❚❚";
    document.getElementById("msgBox").classList.remove("show");
    startClock();
  }
}

function closeMsg() {
  if (finished) {
    openMenu();
  } else if (paused) {
    togglePause();
  }
}

function startClock() {
  clearInterval(tmr);
  tmr = setInterval(function() {
    sec++;
    document.getElementById("tm").textContent = formatTime(sec);
  }, 1000);
}

function openMenu() {
  clearInterval(tmr);
  inMenu = true;
  paused = false;
  finished = false;
  sel = -1;
  sec = 0;
  document.getElementById("tm").textContent = "00:00";
  document.getElementById("pb").textContent = "▶";
  document.getElementById("msgBox").classList.remove("show");
  document.getElementById("menuBox").classList.add("show");
